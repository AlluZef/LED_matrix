; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:wemos_d1]                          ; Среда для Wemos D1
platform = espressif8266                ; Платформа ESP8266
board = d1_mini                         ; Тип платы
framework = arduino                     ; Фреймворк Arduino

; Флаги компиляции для правильного поиска заголовочных файлов
build_flags = 
    -Isrc                               ; Основная папка с исходниками
    -Isrc/effects                       ; Папка с эффектами
    -Isrc/web                           ; Папка с веб-сервером
    -Isrc/utils                         ; Папка с утилитами

; Подключаемые библиотеки
lib_deps = 
    fastled/FastLED@^3.6.0              ; Библиотека для светодиодов
    paulstoffregen/Time@^1.6.1          ; Библиотека для работы со временем
    ; ArduinoJson может понадобиться для расширения функционала

; Настройки загрузки
;upload_port = /dev/ttyUSB0              ; Порт для загрузки (Linux)
upload_port = COM3                    ; Для Windows
upload_speed = 921600                   ; Скорость загрузки

; Настройки монитора порта
monitor_speed = 115200                  ; Скорость монитора
monitor_rts = 0
monitor_dtr = 0
